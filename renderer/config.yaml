name: Foyer Renderer
version: "0.4.0"
slug: foyer_renderer
description: Renders Home Assistant dashboards, including custom cards, for Foyer Roku TVs.
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
# No published ports: only Home Assistant reaches this add-on, over the internal network.
options:
  ha_token: ""
  ha_url: "http://homeassistant:8123"
  dark: true
  scale: 1.5
  secret: ""
schema:
  ha_token: password
  ha_url: url
  dark: bool
  scale: float(1,3)
  secret: password
